version: '3.8'

services:
  api:
    build: .
    container_name: comptalink-api
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=development
      - PORT=4001
      - MONGO_URI=mongodb://mongodb:27017/comptalink
      - JWT_ACCESS_SECRET=your_jwt_access_secret_here
      - JWT_REFRESH_SECRET=your_jwt_refresh_secret_here
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/node_modules

  mongodb:
    image: mongo:6.0
    container_name: comptalink-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
